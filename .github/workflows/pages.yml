# Compila remate-web como sitio estático y lo publica en GitHub Pages en cada push a main.
# Requisito único: en el repositorio, Settings → Pages → Source = "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remate-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remate-web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npx next build --no-lint
        env:
          # Subcarpeta del sitio (por ejemplo /remate en usuario.github.io/remate).
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Valores públicos: la clave publicable de Supabase está hecha para usarse en el navegador;
          # los permisos reales los imponen las políticas por fila (RLS).
          NEXT_PUBLIC_SUPABASE_URL: https://mtxovxrsqjlblyzxvliq.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_G2gH06_oYPNMv7Jq2BY_9Q_LjmPKudX
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remate-web/out

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
